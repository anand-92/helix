[project]
name = "helix"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.48,!=0.1.49",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "deptry>=0.16.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["python/tests"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "SIM",    # flake8-simplify
  "T20",    # flake8-print (flags print statements)
  "C90",    # mccabe complexity
]
ignore = [
  "T201",   # allow print() in action scripts and server
  "E501",   # line length handled by formatter
  "SIM117", # nested with statements — often clearer for test setup
  "UP007",  # Optional[X] -> X | None — not yet adopted across codebase
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
explicit_package_bases = true
exclude = [
  "python/tests/",
  "python/agents/",
  ".venv/",
  "node_modules/",
]
mypy_path = "python"

[[tool.mypy.overrides]]
module = [
  "claude_agent_sdk.*",
  "sklearn.*",
  "aiohttp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "orchestrator",
  "main",
  "server",
  "agents.*",
  "events",
  "utils",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
check_untyped_defs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
  "memory.*",
]
disallow_any_generics = false

[tool.deptry]
exclude = ["python/tests"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "aiohttp",
  "websockets",
]
DEP003 = [
  "starlette",
]

[tool.jscpd]
threshold = 5
reporters = ["console"]
ignore = [
  "node_modules/**",
  ".venv/**",
  "dist/**",
  "frontend/src/components/ui/**",
  "**/*.lock",
  "**/*.json",
]
